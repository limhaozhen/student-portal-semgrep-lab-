{% extends "base.html" %}
{% block title %}Verify sign-in{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="card auth-card">
    <h1>Two-step verification</h1>
    <p class="muted">Enter the 6-digit code from your authenticator app.</p>
    {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" class="stack">
      {{ csrf_field() }}
      <label>Authentication code
        <input name="code" inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7" autocomplete="one-time-code" required autofocus>
      </label>
      <button type="submit" class="btn btn-primary btn-block">Verify</button>
    </form>
    <p class="hint"><a href="{{ url_for('auth.login') }}">Start over</a></p>
  </div>
</section>
{% endblock %}
